services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: tenantrix-app
    container_name: tenantrix_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php-dev.ini:/usr/local/etc/php/conf.d/99-custom.ini
    environment:
      - APP_ENV=local
      - PHP_IDE_CONFIG=serverName=tenantrix
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tenantrix

  nginx:
    image: nginx:1.25-alpine
    container_name: tenantrix_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - tenantrix

  mysql:
    image: mysql:8.0
    container_name: tenantrix_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-tenantrix}
      MYSQL_USER: ${DB_USERNAME:-tenantrix}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tenantrix

  redis:
    image: redis:7-alpine
    container_name: tenantrix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tenantrix

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: tenantrix-app
    container_name: tenantrix_horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tenantrix

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    image: tenantrix-app
    container_name: tenantrix_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tenantrix

  mailpit:
    image: axllent/mailpit:latest
    container_name: tenantrix_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - tenantrix

  minio:
    image: minio/minio:latest
    container_name: tenantrix_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minio123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - tenantrix

networks:
  tenantrix:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
